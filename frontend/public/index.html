<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a73e8" />
    <meta
      name="description"
      content="FixIt met en relation clients et artisans qualifiés (plomberie, électricité, peinture, réparation...) en Tunisie. Publiez une demande, recevez des offres, choisissez votre artisan."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Police "Space Grotesk" chargée une seule fois ici, pour toute l'app.
      Avant, chaque page (Dashboard, DashboardArtisan, ArtisansListe...) réinjectait
      son propre <style>@import url(...)</style> à chaque render — en plus d'être
      redondant, un @import CSS bloque le rendu plus qu'un <link> classique.
      preconnect accélère la connexion aux serveurs de polices avant même
      que le CSS ne soit demandé.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>FixIt – Trouvez un artisan près de chez vous</title>
  </head>
  <body>
    <noscript>Vous devez activer JavaScript pour utiliser FixIt.</noscript>
    <div id="root"></div>
  </body>
</html>
